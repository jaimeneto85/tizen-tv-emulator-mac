<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tvemu Remote Control</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main id="remote-root" class="tvemu-shell">
        <section class="remote-handset" aria-label="TV Remote Control">
            <header class="remote-header">
                <span class="brand-mark">tvemu</span>
                <span class="connection-pill" data-role="connection-status">Connecting</span>
            </header>

            <div class="remote-row remote-top-row">
                <button type="button" class="remote-key key-utility" data-key="Source" aria-label="Source">Source</button>
                <button type="button" class="remote-key key-danger" data-key="Exit" aria-label="Exit">Exit</button>
            </div>

            <div class="numpad-grid" role="group" aria-label="Number Pad">
                <button type="button" class="remote-key" data-key="1" aria-label="1">1</button>
                <button type="button" class="remote-key" data-key="2" aria-label="2">2</button>
                <button type="button" class="remote-key" data-key="3" aria-label="3">3</button>
                <button type="button" class="remote-key" data-key="4" aria-label="4">4</button>
                <button type="button" class="remote-key" data-key="5" aria-label="5">5</button>
                <button type="button" class="remote-key" data-key="6" aria-label="6">6</button>
                <button type="button" class="remote-key" data-key="7" aria-label="7">7</button>
                <button type="button" class="remote-key" data-key="8" aria-label="8">8</button>
                <button type="button" class="remote-key" data-key="9" aria-label="9">9</button>
                <button type="button" class="remote-key" data-key="Minus" aria-label="Dash">-</button>
                <button type="button" class="remote-key" data-key="0" aria-label="0">0</button>
                <button type="button" class="remote-key key-compact" data-key="PreviousChannel" aria-label="Previous Channel">PRE-CH</button>
            </div>

            <div class="rocker-band">
                <div class="rocker-column" role="group" aria-label="Volume">
                    <button type="button" class="remote-key" data-key="VolumeUp" aria-label="Volume Up">VOL +</button>
                    <button type="button" class="remote-key" data-key="VolumeDown" aria-label="Volume Down">VOL -</button>
                </div>
                <div class="rocker-center">
                    <button type="button" class="remote-key key-compact" data-key="VolumeMute" aria-label="Mute">MUTE</button>
                    <button type="button" class="remote-key key-compact" data-key="ChannelList" aria-label="Channel List">CH LIST</button>
                </div>
                <div class="rocker-column" role="group" aria-label="Channel">
                    <button type="button" class="remote-key" data-key="ChannelUp" aria-label="Channel Up">CH +</button>
                    <button type="button" class="remote-key" data-key="ChannelDown" aria-label="Channel Down">CH -</button>
                </div>
            </div>

            <div class="dpad-grid" role="group" aria-label="Directional Pad">
                <span class="dpad-spacer" aria-hidden="true"></span>
                <button type="button" class="remote-key key-dpad" data-key="ArrowUp" aria-label="Up">▲</button>
                <span class="dpad-spacer" aria-hidden="true"></span>
                <button type="button" class="remote-key key-dpad" data-key="ArrowLeft" aria-label="Left">◀</button>
                <button type="button" class="remote-key key-enter" data-key="Enter" aria-label="Enter">OK</button>
                <button type="button" class="remote-key key-dpad" data-key="ArrowRight" aria-label="Right">▶</button>
                <span class="dpad-spacer" aria-hidden="true"></span>
                <button type="button" class="remote-key key-dpad" data-key="ArrowDown" aria-label="Down">▼</button>
                <span class="dpad-spacer" aria-hidden="true"></span>
            </div>

            <div class="nav-row" role="group" aria-label="Navigation and Menus">
                <button type="button" class="remote-key key-compact" data-key="Back" aria-label="Back">Back</button>
                <button type="button" class="remote-key key-compact" data-key="Info" aria-label="Info">Info</button>
                <button type="button" class="remote-key key-compact" data-key="Menu" aria-label="Menu">Menu</button>
                <button type="button" class="remote-key key-compact" data-key="Tools" aria-label="Tools">Tools</button>
                <button type="button" class="remote-key key-compact" data-key="Guide" aria-label="Guide">Guide</button>
            </div>

            <div class="color-row" role="group" aria-label="Color Keys">
                <button type="button" class="remote-key key-color key-red" data-key="ColorF0Red" aria-label="Red">A</button>
                <button type="button" class="remote-key key-color key-green" data-key="ColorF1Green" aria-label="Green">B</button>
                <button type="button" class="remote-key key-color key-yellow" data-key="ColorF2Yellow" aria-label="Yellow">C</button>
                <button type="button" class="remote-key key-color key-blue" data-key="ColorF3Blue" aria-label="Blue">D</button>
            </div>

            <div class="media-grid" role="group" aria-label="Media Transport">
                <button type="button" class="remote-key key-compact" data-key="MediaRewind" aria-label="Rewind">⏪</button>
                <button type="button" class="remote-key key-compact" data-key="MediaPlay" aria-label="Play">▶</button>
                <button type="button" class="remote-key key-compact" data-key="MediaPause" aria-label="Pause">⏸</button>
                <button type="button" class="remote-key key-compact" data-key="MediaPlayPause" aria-label="Play or Pause">⏯</button>
                <button type="button" class="remote-key key-compact" data-key="MediaStop" aria-label="Stop">⏹</button>
                <button type="button" class="remote-key key-compact" data-key="MediaFastForward" aria-label="Fast Forward">⏩</button>
                <button type="button" class="remote-key key-compact key-record" data-key="MediaRecord" aria-label="Record">⏺</button>
            </div>
        </section>

        <aside class="side-panel" aria-label="Emulator Status and Controls">
            <section class="panel-card">
                <h2>Device Profile</h2>
                <p class="profile-label" data-role="profile-label">Waiting for host state...</p>
                <p class="profile-meta" data-role="profile-meta"></p>
            </section>

            <section class="panel-card">
                <div class="panel-row-header">
                    <h2>Running App</h2>
                    <button
                        type="button"
                        class="action-button action-danger"
                        data-action="terminate"
                        aria-label="Terminate Running App"
                        disabled
                    >
                        Terminate
                    </button>
                </div>
                <p class="running-app" data-role="running-app">None</p>
            </section>

            <section class="panel-card">
                <h2>Installed Apps</h2>
                <ul class="app-list" data-role="app-list"></ul>
            </section>

            <section class="panel-card panel-logs">
                <h2>Console Log</h2>
                <div class="log-list" data-role="log-list" role="log" aria-live="polite"></div>
            </section>
        </aside>
    </main>
    <script type="module" src="./app.js"></script>
</body>
</html>
