<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>tvemu NUI</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000;
        }
        #tvemu-nui-root {
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #000000;
        }
        #tvemu-nui-underlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            z-index: 0;
            pointer-events: none;
        }
        #tvemu-nui-stage {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            z-index: 1;
            overflow: hidden;
        }
        .nui-node {
            position: absolute;
            left: 0;
            top: 0;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .nui-text-span {
            display: block;
            max-width: 100%;
            pointer-events: none;
        }
        .nui-image-img {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .nui-field-input {
            display: block;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: none;
            outline: none;
            background: transparent;
            margin: 0;
            padding: 0;
            font: inherit;
            color: inherit;
        }
        .nui-field-input::placeholder {
            color: var(--nui-placeholder-color, rgba(255, 255, 255, 0.5));
        }
    </style>
</head>
<body>
    <div id="tvemu-nui-root">
        <div id="tvemu-nui-underlay"></div>
        <div id="tvemu-nui-stage"></div>
    </div>
    <script src="./nui-renderer.js"></script>
</body>
</html>
